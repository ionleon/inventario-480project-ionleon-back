doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        types:
            sector_id: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\SectorIdType
            sector_name: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\SectorNameType
            user_id: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\UserIdType
            user_name: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\UserNameType
            user_surname: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\UserSurnameType
            user_email: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\EmailType
            user_password: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\PasswordType
            technology_id: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\TechnologyIdType
            technology_name: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\TechnologyNameType
            project_role_id: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\ProjectRoleIdType
            project_role_name: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\ProjectRoleNameType
            client_id: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\ClientIdType
            client_name: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\ClientNameType
            contact_id: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\ContactIdType
            contact_name: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\ContactNameType
            contact_email: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\ContactEmailType
            phone_number: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\PhoneType
            project_id: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\ProjectIdType
            project_name: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\ProjectNameType
            project_description: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\ProjectDescriptionType
            project_start_date: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\ProjectStartDateType
            project_end_date: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\ProjectEndDateType
            development_notes: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\DevelopmentNotesType
            development_progress: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\DevelopmentProgressType
            link_id: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\LinkIdType
            link_url: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\LinkUrlType
            link_label: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\LinkLabelType
            project_user_id: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\ProjectUserIdType
            project_user_allocation: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\ProjectUserAllocationType
            time_entry_id: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\TimeEntryIdType
            time_entry_date: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\TimeEntryDateType
            time_entry_hours: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\TimeEntryHoursType
            time_entry_description: App\Core\Infrastructure\Persistence\Doctrine\DBAL\Types\TimeEntryDescriptionType

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            Core:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/src/Core/Infrastructure/Persistence/Doctrine/ORM/Mapping/XML'
                prefix: 'App\Core\Domain\Model\Aggregate'
                alias: Core
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src'
                prefix: 'App'
                alias: App
            # Auth RefreshToken is now mapped via the Core XML mapping.
            # Legacy Auth mapping removed to avoid duplicate table registration.

        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
