# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    _instanceof:
        App\Core\Application\Bus\CommandHandler:
            tags:
                - { name: messenger.message_handler, bus: command.bus }
        App\Core\Application\Bus\QueryHandler:
            tags:
                - { name: messenger.message_handler, bus: query.bus }

    # default configuration for services in *this* file
    _defaults:
        bind:
            $blacklistCache: '@blacklist.cache'
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Auth/'
            - '../src/Kernel.php'

    App\Auth\:
        resource: '../src/Auth/'
        exclude:
            - '../src/Auth/Domain/RefreshToken/'


    App\Auth\Domain\RefreshToken\RefreshTokenRepositoryInterface: '@App\Auth\Infrastructure\Persistence\DoctrineRefreshTokenRepository'
    App\Auth\Domain\Service\TokenBlacklistInterface: '@App\Auth\Infrastructure\Service\SymfonyCacheBlacklist'
    App\Auth\Domain\Service\TokenPayloadExtractorInterface: '@App\Auth\Infrastructure\Service\LexikPayloadExtractor'



    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Auth\Infrastructure\EventListener\JWTCreatedListener:
        tags:
            - { name: 'kernel.event_listener', event: 'lexik_jwt_authentication.on_jwt_created', method: 'onJWTCreated' }

    # Legacy ExceptionListener — disabled in favour of App\App\UI\API\Response\Service\ExceptionListener (Plan 6)
    # App\Shared\Infrastructure\EventListener\ExceptionListener:
    #     tags:
    #         - { name: 'kernel.event_listener', event: 'kernel.exception' }

    App\App\UI\API\Response\Service\ExceptionListener:
        tags:
            - { name: kernel.event_listener, event: kernel.exception }

    App\Core\Application\Bus\CommandBus:
        class: App\Shared\Infrastructure\Bus\MessengerCommandBus
        arguments: ['@command.bus']

    App\Core\Application\Bus\QueryBus:
        class: App\Shared\Infrastructure\Bus\MessengerQueryBus
        arguments: ['@query.bus']

    App\Core\Domain\Service\Security\SecurityChecker:
        class: App\Core\Domain\Service\Security\RoleBasedSecurityChecker

    App\App\Auth\Domain\Service\SecurityTokenExtractorInterface:
        class: App\App\Auth\Infrastructure\JwtSecurityTokenExtractor

    App\App\UI\API\Response\Service\GetCurrentEnvironment:
        arguments: ['%kernel.environment%']

