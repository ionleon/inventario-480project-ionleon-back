services:
  database:
    image: postgres:18-alpine
    container_name: symfony_db
    environment:
      POSTGRES_DB: project_inventory_480_db
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: skibidiman123
    ports:
      - "5432:5432"
    volumes:
      - project_480_db_data:/var/lib/postgresql
    networks:
      - symfony_net

  php:
    build: .
    container_name: symfony_php
    volumes:
      - ./:/var/www/html
    depends_on:
      - database
    networks:
      - symfony_net

  nginx:
    image: nginx:alpine
    container_name: symfony_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - symfony_net

volumes:
    project_480_db_data:

networks:
  symfony_net:
    driver: bridge
